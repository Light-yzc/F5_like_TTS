# VAE-DiT TTS — Small Config (~180M main params, single CA + LARoPE)

vae:
  model_path: "/content/F5_like_TTS/model_files/vae"
  precision: "fp16"

model:
  # DiT
  # Deeper than tiny for stronger latent modeling and coverage.
  latent_dim: 64
  dit_dim: 640
  depth: 21
  heads: 10
  head_dim: 64
  ff_mult: 2.5
  use_text_expand: false
  use_text_expand_pos_emb: false
  text_expand_pos_emb_scale: 1

  # F5-like Text Encoder
  # ConvNeXt for local phonetics + Transformer for global token coverage.
  text_encoder_vocab_size: 128
  text_conv_depth: 8
  text_conv_kernel: 9
  text_conv_ff_mult: 3
  text_transformer_depth: 4
  text_transformer_heads: 8
  text_transformer_ff_mult: 2.5

  # Duration Predictor
  # Approx params: ~10M with current implementation
  duration_hidden_dim: 384
  duration_num_layers: 4
  duration_nhead: 8
  duration_conv_blocks: 3
  duration_conv_kernel: 13
  duration_noise_dim: 64
  duration_disc_hidden: 512
  duration_adv_weight: 0.1
  duration_disc_enabled: true
  duration_disc_lr: 2.0e-4
  duration_disc_start_step: 2000
  duration_disc_warmup_steps: 3000

  # Latent GAN
  latent_disc_hidden: 640
  latent_disc_scales: 5
  latent_adv_weight: 0.1
  latent_fm_weight: 0.5
  latent_gan_t_threshold: 0.5
  latent_disc_enabled: true
  latent_disc_lr: 2.0e-4
  latent_disc_start_step: 350000
  latent_disc_warmup_steps: 10000

  # Flow Matching
  cfg_dropout_rate: 0.15
  default_cfg_scale: 3.0
  default_infer_steps: 30
  sway_coef: -1.0
  duration_infer_scale: 1.08
  duration_infer_bias_sec: 0.12

audio:
  sample_rate: 48000
  latent_rate: 25
  max_duration_sec: 30
  min_duration_sec: 3
  prompt_ratio_min: 0.2
  prompt_ratio_max: 0.5

wandb:
  project: "vae_dit_tts_small_single_ca_larope"
  mode: "online"

training:
  batch_size: 8
  learning_rate: 1.5e-4
  weight_decay: 0.01
  warmup_steps: 5000
  max_steps: 1200000
  scheduler: cosine
  gradient_clip: 1.0
  fp16: true
  gradient_checkpointing: false
  gradient_accumulation_steps: 1
  ctc_every_steps: 5
  ctc_weight_start: 0.03
  ctc_weight_end: 0.01
  ctc_decay_start: 0
  ctc_decay_end: 1200000
  attention_prior_enabled: false
  attention_prior_sigma: 0.45
  attention_prior_weight: 0.005
  attention_prior_every_steps: 1
  attention_prior_layer_indices: [12, 13, 14]
  attention_prior_start_step: 300000
  attention_prior_warmup_steps: 10000
