# VAE-DiT TTS — Tiny Config (~108M main trainable params)

vae:
  model_path: "/content/F5_like_TTS/model_files/vae"
  precision: "fp16"

model:
  # DiT (depth=10, dual cross-attention per layer)
  # Approx params: ~80M DiT + ~18M Text Encoder
  latent_dim: 64
  dit_dim: 640
  depth: 10
  heads: 10
  head_dim: 64
  ff_mult: 2.5
  num_cross_attn: 2
  use_text_expand: true
  use_text_expand_pos_emb: true
  text_expand_pos_emb_scale: 1

  # F5-like Text Encoder (decoupled dim=512, ConvNeXt + Transformer)
  # ConvNeXt: local phonetics, Transformer: global context for character disambiguation
  # Approx params: ~26M
  text_enc_dim: 512
  text_encoder_vocab_size: 128
  text_conv_depth: 6
  text_conv_kernel: 7
  text_conv_ff_mult: 2
  text_transformer_depth: 6
  text_transformer_heads: 8
  text_transformer_ff_mult: 2.5

  # Duration Predictor
  duration_hidden_dim: 384
  duration_num_layers: 4
  duration_nhead: 8
  duration_conv_blocks: 3
  duration_conv_kernel: 13
  duration_noise_dim: 64
  duration_disc_hidden: 512
  duration_adv_weight: 0.1
  duration_disc_enabled: true
  duration_disc_lr: 2.0e-4
  duration_disc_start_step: 2000
  duration_disc_warmup_steps: 3000

  # Latent GAN
  latent_disc_hidden: 512
  latent_disc_scales: 4
  latent_adv_weight: 0.1
  latent_fm_weight: 0.5
  latent_gan_t_threshold: 0.5
  latent_disc_enabled: true
  latent_disc_lr: 2.0e-4
  latent_disc_start_step: 350000
  latent_disc_warmup_steps: 10000

  # Flow Matching
  cfg_dropout_rate: 0.15
  default_cfg_scale: 3.0
  default_infer_steps: 30
  sway_coef: -1.0
  duration_infer_scale: 1.12
  duration_infer_bias_sec: 0.15

audio:
  sample_rate: 48000
  latent_rate: 25
  max_duration_sec: 30
  min_duration_sec: 3
  prompt_ratio_min: 0.2
  prompt_ratio_max: 0.5

wandb:
  project: "vae_dit_tts_tiny_l4"
  mode: "online"

training:
  batch_size: 8
  learning_rate: 1.5e-4
  weight_decay: 0.01
  warmup_steps: 5000
  max_steps: 750000
  scheduler: cosine
  gradient_clip: 1.0
  fp16: true
  gradient_checkpointing: false
  gradient_accumulation_steps: 1
  log_every_steps: 25
  infer_every_steps: 2000
  save_every_steps: 2000
  ctc_every_steps: 65
  ctc_weight_start: 0.05
  ctc_weight_end: 0.02
  ctc_decay_start: 100000
  ctc_decay_end: 750000
  attention_prior_enabled: true
  attention_prior_sigma: 0.3
  attention_prior_weight: 0.015
  attention_prior_every_steps: 1
  attention_prior_layer_indices: [4, 5, 6, 7, 8, 9]
  attention_prior_start_step: 0
  attention_prior_warmup_steps: 10000
