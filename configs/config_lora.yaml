# VAE-DiT TTS — LoRA Fine-tuning Config

vae:
  model_path: "/content/F5_like_TTS/model_files/vae"
  precision: "fp16"

model:
  # Must match base model architecture
  latent_dim: 64
  dit_dim: 1024
  depth: 30
  heads: 16
  head_dim: 64
  ff_mult: 2.5

  # Text Encoder (frozen during LoRA)
  text_encoder_vocab_size: 128
  text_conv_depth: 14
  text_conv_kernel: 13
  text_conv_ff_mult: 4

  # Duration Predictor (frozen during LoRA)
  duration_hidden_dim: 512
  duration_num_layers: 4
  duration_nhead: 8
  duration_conv_blocks: 3
  duration_conv_kernel: 7

  # Flow Matching
  cfg_dropout_rate: 0.15
  default_cfg_scale: 3.0
  default_infer_steps: 30
  sway_coef: -1.0

lora:
  rank: 16
  alpha: 16
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  dropout: 0.05

audio:
  sample_rate: 48000
  latent_rate: 25
  max_duration_sec: 30
  min_duration_sec: 3
  prompt_ratio_min: 0.2
  prompt_ratio_max: 0.5

training:
  batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  max_steps: 50000
  gradient_clip: 1.0
  fp16: true
  gradient_checkpointing: false
  infer_every: 500
  save_every: 2000
